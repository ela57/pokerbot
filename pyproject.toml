[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "poker-practice"
version = "0.1.0"
description = "A local, reproducible poker bot practice environment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pokerkit==0.7.7",
  "eval7==0.1.11",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
poker-practice = "pokerpractice.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["pokerpractice"]
